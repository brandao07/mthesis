name: Python Benchmark (Regex-Redux)
author: André Brandão <https://github.com/brandao07>
description: Python benchmarks using Python 3.13 Slim

services:
  python-container:
    image: python:3.13-slim
    setup-commands:
      - command: apt-get update && apt-get install -y --no-install-recommends libpcre2-8-0 && rm -rf /var/lib/apt/lists/*
    command: sleep infinity
    
flow:
  - name: Python-Regex-Redux
    container: python-container
    commands:
      - type: console
        shell: sh
        command: python3 -OO /tmp/repo/benchmarks/python/regex-redux/main.py 0 < /tmp/repo/inputs/fasta-5000000.txt


