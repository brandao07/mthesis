name: Python Benchmark (Binary-Trees)
author: André Brandão <https://github.com/brandao07>
description: Python benchmarks using Python 3.13 Slim

services:
  python-container:
    image: python:3.13-slim
    command: sleep infinity

flow:
  - name: Python-Binary-Trees
    container: python-container
    commands:
      - type: console
        command: python3 -OO /tmp/repo/benchmarks/python/binary-trees/main.py 21


