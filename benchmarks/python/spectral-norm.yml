name: Python Benchmark (Spectral-Norm)
author: André Brandão <https://github.com/brandao07>
description: Python benchmarks using Python 3.13 Slim

services:
  python-container:
    image: python:3.13-slim
    command: sleep infinity

flow:
  - name: Python-Spectral-Norm
    container: python-container
    commands:
      - type: console
        command: python3 -OO /tmp/repo/benchmarks/python/spectral-norm/main.py 5500

