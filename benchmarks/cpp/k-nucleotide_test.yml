name: CPP Benchmark (K-Nucleotide)
author: André Brandão <https://github.com/brandao07>
description: CPP benchmarks using GCC 15.2.0

services:
  cpp-container:
    image: gcc:15.2.0
    setup-commands:
      - command: g++ -pipe -O3 -fomit-frame-pointer -march=native -std=c++17 /tmp/repo/benchmarks/cpp/k-nucleotide/main.cpp -o /tmp/main -lpthread
    command: sleep infinity

flow:
  - name: CPP-K-Nucleotide
    container: cpp-container
    commands:
      - type: console
        shell: sh
        command: /tmp/main < /tmp/repo/inputs/fasta-100.txt


