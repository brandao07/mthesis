name: CPP Benchmark (Fannkuch-Redux)
author: André Brandão <https://github.com/brandao07>
description: CPP benchmarks using GCC 15.2.0

services:
  cpp-container:
    image: gcc:15.2.0
    setup-commands:
      - command: g++ -pipe -O3 -fomit-frame-pointer -march=native -std=c++17 -fopenmp /tmp/repo/benchmarks/cpp/fannkuch-redux/main.cpp -o /tmp/main
    command: sleep infinity

flow:
  - name: CPP-Fannkuch-Redux
    container: cpp-container
    commands:
      - type: console
        command: /tmp/main 6


