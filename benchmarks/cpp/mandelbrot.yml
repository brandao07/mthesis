name: CPP Benchmark (Mandelbrot)
author: André Brandão <https://github.com/brandao07>
description: CPP benchmarks using GCC 15.2.0

services:
  cpp-container:
    image: gcc:15.2.0
    setup-commands:
      - command: g++ -pipe -O3 -fomit-frame-pointer -march=native -std=c++17 -mno-fma /tmp/repo/benchmarks/cpp/mandelbrot/main.cpp -o /tmp/main -pthread
    command: sleep infinity

flow:
  - name: CPP-Mandelbrot
    container: cpp-container
    commands:
      - type: console
        command: /tmp/main 16000
