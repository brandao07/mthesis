name: CPP Benchmark (N-Body)
author: André Brandão <https://github.com/brandao07>
description: CPP benchmarks using GCC 15.2.0

services:
  cpp-container:
    image: gcc:15.2.0
    setup-commands:
      - command: g++ -pipe -O3 -fomit-frame-pointer -march=native -std=c++17 /tmp/repo/benchmarks/cpp/n-body/main.cpp -o /tmp/main
    command: sleep infinity

flow:
  - name: CPP-N-Body
    container: cpp-container
    commands:
      - type: console
        command: /tmp/main 500


