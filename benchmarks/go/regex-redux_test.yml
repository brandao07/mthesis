name: Go Benchmark (Regex-Redux)
author: André Brandão <https://github.com/brandao07>
description: Go benchmarks using Golang 1.25 Alpine

services:
  go-container:
    image: golang:1.25-alpine
    setup-commands:
      - shell: sh
        command: apk add --no-cache gcc musl-dev pcre-dev
      - shell: sh
        command: mkdir -p /tmp/go-regex-redux-src && cp /tmp/repo/benchmarks/go/regex-redux/main.go /tmp/go-regex-redux-src/ && cd /tmp/go-regex-redux-src && go mod init regex-redux && go get github.com/GRbit/go-pcre@v1.0.0 && go build -o /tmp/go-regex-redux .
    command: sleep infinity

flow:
  - name: Go-Regex-Redux
    container: go-container
    commands:
      - type: console
        shell: sh
        command: /tmp/go-regex-redux < /tmp/repo/inputs/fasta-100.txt


